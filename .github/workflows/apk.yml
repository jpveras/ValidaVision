name: APK Android (TWA)

# Gera o APK do app "Toca dos Bug Hunters" (Trusted Web Activity = a Toca em tela cheia pelo Chrome).
# Rodar em Actions → "APK Android (TWA)" → Run workflow. O APK sai em "Artifacts".
# Para uma versão nova: aumente appVersionCode/appVersionName em android/twa-manifest.json.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/twa-manifest.json"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Bubblewrap
        run: npm i -g @bubblewrap/cli@1
      - name: Configuração (JDK + Android SDK do runner)
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Chave de assinatura
        working-directory: android
        env:
          KS_PW_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_PW_SECRET" ]; then
            # A chave fica no repositório CRIPTOGRAFADA (chave-app.jks.enc); só abre com a senha do segredo.
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in chave-app.jks.enc -out android.keystore -pass env:KS_PW_SECRET
            echo "KS_PW=$KS_PW_SECRET" >> "$GITHUB_ENV"
            echo "OFICIAL=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo ANDROID_KEYSTORE_PASSWORD não configurado — APK com chave PROVISÓRIA (abre com barra de endereço)."
            keytool -genkeypair -keystore android.keystore -alias bughunters -keyalg RSA -keysize 2048 -validity 365 -storepass provisoria -keypass provisoria -dname "CN=Teste"
            echo "KS_PW=provisoria" >> "$GITHUB_ENV"
            echo "OFICIAL=0" >> "$GITHUB_ENV"
          fi
      - name: Gerar projeto e APK
        working-directory: android
        run: |
          # O Bubblewrap gera o projeto Android a partir do twa-manifest.json...
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null
          # ...e compilamos com o Gradle + ferramentas do SDK do próprio runner.
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk alinhado.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias bughunters --ks-pass env:KS_PW --key-pass env:KS_PW --out toca-bug-hunters.apk alinhado.apk
          "$BT/apksigner" verify --print-certs toca-bug-hunters.apk
          ls -la toca-bug-hunters.apk
      - uses: actions/upload-artifact@v4
        with:
          name: toca-bug-hunters-apk
          path: android/toca-bug-hunters.apk
      - name: Publicar no GitHub (Releases)
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('twa-manifest.json'))['appVersionName'])")
          if [ "$OFICIAL" = "1" ]; then TAG="app-v$VER"; TITULO="App Android $VER"; PRE=""; else TAG="app-teste"; TITULO="App Android (teste, chave provisória)"; PRE="--prerelease"; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" toca-bug-hunters.apk --title "$TITULO" --notes "APK da Toca dos Bug Hunters (abre https://bughunters-time.vercel.app em tela cheia). Instale no Android permitindo 'fontes desconhecidas'." --target "$GITHUB_SHA" $PRE
