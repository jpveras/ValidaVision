name: APK Android (TWA)

# Gera o APK do app "Toca dos Bug Hunters" (Trusted Web Activity = a Toca em tela cheia pelo Chrome).
# Rodar em Actions → "APK Android (TWA)" → Run workflow. O APK sai em "Artifacts".
# Para uma versão nova: aumente appVersionCode/appVersionName em android/twa-manifest.json.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/twa-manifest.json"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Bubblewrap
        run: npm i -g @bubblewrap/cli@1
      - name: Configuração (JDK + Android SDK do runner)
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Chave de assinatura
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
            echo "KS_PW=$KS_PW" >> "$GITHUB_ENV"
          else
            # Sem os segredos: chave PROVISÓRIA só para teste (o app abre com barra de endereço).
            echo "::warning::Segredos ANDROID_KEYSTORE_* não configurados — usando chave provisória (só para teste)."
            keytool -genkeypair -keystore android.keystore -alias bughunters -keyalg RSA -keysize 2048 -validity 365 -storepass provisoria -keypass provisoria -dname "CN=Teste"
            echo "KS_PW=provisoria" >> "$GITHUB_ENV"
          fi
          keytool -list -v -keystore android.keystore -alias bughunters -storepass "$(grep KS_PW "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" | grep SHA256
      - name: Gerar projeto e APK
        working-directory: android
        run: |
          export BUBBLEWRAP_KEYSTORE_PASSWORD="$KS_PW" BUBBLEWRAP_KEY_PASSWORD="$KS_PW"
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json < /dev/null
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: toca-bug-hunters-apk
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
