<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elogie um Colega · Valida Vision</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--top:#033a45;--teal:#109c8a;--teal2:#0b7f70;--teal-soft:#e6f5f2;--ink:#0b3b47;--text:#25343a;--muted:#6b7a80;--line:#dfe5e3;--page:#eef1f0;--red:#d64545}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);font-family:Roboto,"Segoe UI",Arial,sans-serif;color:var(--text);font-size:15px;min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
.topbar{background:var(--top);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px}
.topbar img{width:36px;height:36px;border-radius:50%}
.topbar b{font-size:19px}.topbar b span{font-weight:400;opacity:.85}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:20px 16px 32px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px 20px}
.icon{width:52px;height:52px;border-radius:12px;background:var(--teal-soft);display:grid;place-items:center;margin-bottom:12px}
.icon svg{width:26px;height:26px;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;font-size:26px;font-weight:500;color:var(--ink)}
.sub{margin:8px 0 20px;color:var(--muted);line-height:1.5}
.label{display:flex;justify-content:space-between;font-size:13px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;margin:0 0 8px}
.label .req{color:var(--red)}
.counter{font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:400}
.input{width:100%;border:1px solid #cfd8d6;border-radius:6px;padding:14px;font:inherit;font-size:16px;color:var(--text);background:#fff;margin-bottom:18px}
textarea.input{min-height:130px;resize:vertical;line-height:1.5}
.vv-emojis{margin:-10px 0 18px!important}
.input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
button{width:100%;height:52px;border:0;border-radius:6px;background:var(--teal);color:#fff;font:inherit;font-size:14px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
button:hover{background:var(--teal2)}
button:disabled{opacity:.5;cursor:not-allowed}
button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-outline{background:#fff;color:var(--text);border:1px solid #9aa6a9}
.btn-outline:hover{background:#f5f7f6}
.status{min-height:20px;margin-top:12px;font-size:14px;color:var(--red);text-align:center}
.done{text-align:center;padding:12px 0 4px}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--teal-soft);display:grid;place-items:center;margin:0 auto 14px}
.done .ok svg{width:36px;height:36px;stroke:var(--teal);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.done h2{margin:0 0 6px;font-size:24px;color:var(--ink);font-weight:500}
.done p{margin:0 0 22px;color:var(--muted);line-height:1.5}
.progress{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
.bar{height:8px;border-radius:99px;background:#e3e9e7;overflow:hidden;margin:8px auto 0;max-width:280px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#2fc28f);transition:width .5s}
</style><link rel="stylesheet" href="/vv-tema-auto.css?v=25">
<link rel="stylesheet" href="/vv-tema.css?v=25">
<script src="/vv-tema.js?v=23"></script>
</head>
<body>
<header class="topbar"><img src="/logo.png" alt=""><b>Valida <span>Vision</span></b></header>
<main>
  <section class="card">
    <div id="formView">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
      <h1>Elogie um Colega</h1>
      <p class="sub">Escolha alguém do time e conte o que essa pessoa faz de especial. As palavras mais usadas vão aparecer no telão!</p>
      <form id="form" novalidate>
        <label class="label" for="nome"><span>Nome do colega <span class="req">*</span></span></label>
        <input class="input" id="nome" maxlength="60" autocomplete="off" placeholder="Ex.: Maria Souza">
        <label class="label" for="texto"><span>Seu elogio <span class="req">*</span></span><span class="counter" id="cnt">0/280</span></label>
        <textarea class="input" id="texto" maxlength="280" placeholder="Ex.: Sempre parceira, organizada e muito atenta aos detalhes nos testes."></textarea>
        <button type="submit" id="enviar"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>Enviar elogio</button>
        <div class="status" id="status" role="status"></div>
      </form>
    </div>
    <div id="doneView" class="done" hidden>
      <div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg></div>
      <h2>Elogio enviado! 💚</h2>
      <p id="doneMsg">Obrigado por reconhecer um colega. Fique de olho no telão!</p>
      <button type="button" id="outro" class="btn-outline">Elogiar outra pessoa</button>
    </div>
    <div class="progress" id="progress" hidden><span id="progTxt"></span><div class="bar"><i id="bar"></i></div></div>
  </section>
</main>
<script src="/vv-emojis.js?v=22"></script>
<script>
const $=id=>document.getElementById(id);
const nome=$('nome'),texto=$('texto'),enviar=$('enviar'),statusEl=$('status');
if(window.vvEmojis)vvEmojis(texto);
texto.addEventListener('input',()=>$('cnt').textContent=`${texto.value.length}/280`);
async function progresso(){
  try{const d=await (await fetch('/api/elogios',{cache:'no-store'})).json();
    const falta=Math.max(0,d.meta-d.total);
    $('progTxt').textContent=falta?`Já temos ${d.total} de ${d.meta} elogios. ${falta===1?"Falta só 1":`Faltam ${falta}`} para revelar a nuvem!`:`Meta atingida: ${d.total} elogios! A nuvem já está no telão. 🎉`;
    $('bar').style.width=Math.min(100,d.total/d.meta*100)+'%';$('progress').hidden=false;
  }catch{}
}
$('form').addEventListener('submit',async e=>{
  e.preventDefault();statusEl.textContent='';
  const n=nome.value.trim(),t=texto.value.trim();
  if(n.length<2){statusEl.textContent='Informe o nome do colega.';return nome.focus()}
  if(t.length<3){statusEl.textContent='Escreva o seu elogio.';return texto.focus()}
  enviar.disabled=true;
  try{
    const r=await fetch('/api/elogios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:n,texto:t})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Não foi possível enviar. Tente novamente.');
    $('doneMsg').textContent=d.pendente?`Seu elogio para ${n} foi recebido e aparece no telão assim que a moderação aprovar. Obrigado por reconhecer um colega!`:`Seu elogio para ${n} já está a caminho do telão. Obrigado por reconhecer um colega!`;
    $('formView').hidden=true;$('doneView').hidden=false;nome.value='';texto.value='';$('cnt').textContent='0/280';
    progresso();
  }catch(err){statusEl.textContent=err.message}finally{enviar.disabled=false}
});
$('outro').onclick=()=>{$('doneView').hidden=true;$('formView').hidden=false;nome.focus()};
progresso();
</script>
</body></html>
